- name: Manage Nginx
  hosts: local
  become: true

  vars:
    page_title: "Ansible practice"
    user_name: "Michael"
    practice_port: 8085

  tasks:
    - name: Ensure Nginx is installed
      ansible.builtin.apt:
        name: nginx
        state: present

    - name: Ensure Nginx is running and enabled
      ansible.builtin.systemd_service:
        name: nginx
        state: started
        enabled: true

    - name: Create Ansible practice page
      ansible.builtin.template:
        src: templates/ansible.html.j2
        dest: /home/micha/site/ansible.html
        mode: '0644'
      notify: Report page update

    - name: Check practice page
      ansible.builtin.uri:
        url: http://localhost/ansible.html
        status_code: 200
        return_content: true
      register: page_result

    - name: Verify page content
      ansible.builtin.assert:
        that:
          - "'This page is managed by Ansible.' in page_result.content"
        success_msg: "Practice page works!"

    - name: Create practice Nginx configuration
      ansible.builtin.template:
        src: templates/ansible-practice.conf.j2
        dest: /etc/nginx/ansible-practice.conf
        mode: '0644'
      notify: Reload Nginx

    - name: Validate Nginx configuration
      ansible.builtin.command: nginx -t
      changed_when: false

    - name: Run pending handlers
      ansible.builtin.meta: flush_handlers

    - name: Check practice site
      ansible.builtin.uri:
        url: "http://localhost:{{ practice_port }}/"
        status_code: 200

  handlers:
    - name: Report page update
      ansible.builtin.debug:
        msg: "The practice page was updated."

    - name: Reload Nginx
      ansible.builtin.systemd_service:
        name: nginx
        state: reloaded
